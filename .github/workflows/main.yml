name: Build Hitbloq qmod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: QPM restore
        uses: QuestPackageManager/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true
          publish: false

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: qpm s build

      - name: Package qmod
        run: qpm qmod zip

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: Hitbloq.qmod
          path: ./*.qmod
          if-no-files-found: error

      - name: Upload .so (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libhitbloq-so
          path: build/*.so
          if-no-files-found: ignore
